name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      run_paid_ai_evals:
        description: Run the Anthropic-backed AI evaluation suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
  NX_HEAD: ${{ github.sha }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: 'npm' }
      - name: Validate AI harness
        run: npm run check:ai-harness
      - name: Verify both dependency locks and security artifacts before install
        run: npm run check:dependency-artifacts
      - name: Validate executable README examples
        run: npm run check:readme-examples
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Test offline Moscow preparation helper
        run: node --test tools/trips/build-moscow.test.mjs
      - run: npm ci
      - run: npm ci --prefix tools/openspec --ignore-scripts
      - name: Verify installed security backports and fresh dependency reports
        run: npm run check:dependencies
      - run: npm run test:dependency-consumers
      - run: dotnet tool restore
      - name: Validate .NET project and test inventory
        run: npm run check:dotnet-inventory
      - run: npx biome ci .
      - run: dotnet csharpier check .

  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore Travel.slnx --no-cache
      - run: dotnet build Travel.slnx --configuration Release --no-restore

  frontend-affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx nx affected -t build test lint --exclude=travel-agency --base=$NX_BASE --head=$NX_HEAD
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flights-demo
      - run: npx playwright test --config tests/travel-e2e/playwright.trips-demo.config.ts

  test-flights-unit:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/flights/Travel.Modules.Flights.Tests.Unit/Travel.Modules.Flights.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/flights/Travel.Modules.Flights.Tests.Unit/Travel.Modules.Flights.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/flights/Travel.Modules.Flights.Tests.Unit/Travel.Modules.Flights.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=flights-unit.trx"

  test-support-unit:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/support/Travel.Modules.Support.Tests.Unit/Travel.Modules.Support.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/support/Travel.Modules.Support.Tests.Unit/Travel.Modules.Support.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/support/Travel.Modules.Support.Tests.Unit/Travel.Modules.Support.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=support-unit.trx"

  test-support-integration:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/support/Travel.Modules.Support.Tests.Integration/Travel.Modules.Support.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/support/Travel.Modules.Support.Tests.Integration/Travel.Modules.Support.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/support/Travel.Modules.Support.Tests.Integration/Travel.Modules.Support.Tests.Integration.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=support-integration.trx"

  test-hotels-unit:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/hotels/Travel.Modules.Hotels.Tests.Unit/Travel.Modules.Hotels.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/hotels/Travel.Modules.Hotels.Tests.Unit/Travel.Modules.Hotels.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/hotels/Travel.Modules.Hotels.Tests.Unit/Travel.Modules.Hotels.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=hotels-unit.trx"

  test-hotels-integration:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/hotels/Travel.Modules.Hotels.Tests.Integration/Travel.Modules.Hotels.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/hotels/Travel.Modules.Hotels.Tests.Integration/Travel.Modules.Hotels.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/hotels/Travel.Modules.Hotels.Tests.Integration/Travel.Modules.Hotels.Tests.Integration.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=hotels-integration.trx"

  test-trips-unit:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/trips/Travel.Modules.Trips.Tests.Unit/Travel.Modules.Trips.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/trips/Travel.Modules.Trips.Tests.Unit/Travel.Modules.Trips.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/trips/Travel.Modules.Trips.Tests.Unit/Travel.Modules.Trips.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=trips-unit.trx"

  test-trips-integration:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Pre-pull the disposable Trips PostgreSQL fixture image
        timeout-minutes: 3
        run: docker pull pgvector/pgvector:pg17
      - run: dotnet restore tests/trips/Travel.Modules.Trips.Tests.Integration/Travel.Modules.Trips.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/trips/Travel.Modules.Trips.Tests.Integration/Travel.Modules.Trips.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/trips/Travel.Modules.Trips.Tests.Integration/Travel.Modules.Trips.Tests.Integration.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=trips-integration.trx"

  test-trips-full-stack:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:trips-stack
      - run: npm run test:trips-full-stack
      - name: Upload sanitized Trips evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trips-full-stack-evidence
          path: |
            TestResults/trips-local-stack/evidence/*.json
            TestResults/trips-local-stack/evidence/*.png
          if-no-files-found: warn
          retention-days: 7

  test-identity-unit:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/identity/Travel.Modules.Identity.Tests.Unit/Travel.Modules.Identity.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/identity/Travel.Modules.Identity.Tests.Unit/Travel.Modules.Identity.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/identity/Travel.Modules.Identity.Tests.Unit/Travel.Modules.Identity.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=identity-unit.trx"

  test-ai:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/Travel.AI.Tests/Travel.AI.Tests.csproj --no-cache
      - run: dotnet build tests/Travel.AI.Tests/Travel.AI.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.AI.Tests/Travel.AI.Tests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=ai-tests.trx"

  test-host-http:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-build --filter "Category!=Integration&Category!=AspireSmoke" --verbosity minimal --logger "trx;LogFileName=host-http.trx"
      - run: dotnet restore tests/rail/Travel.Modules.Rail.Tests.Unit/Travel.Modules.Rail.Tests.Unit.csproj --no-cache
      - run: dotnet build tests/rail/Travel.Modules.Rail.Tests.Unit/Travel.Modules.Rail.Tests.Unit.csproj --configuration Release --no-restore
      - run: dotnet test tests/rail/Travel.Modules.Rail.Tests.Unit/Travel.Modules.Rail.Tests.Unit.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=rail-unit.trx"
      - run: dotnet restore tests/rail/Travel.Modules.Rail.Tests.Integration/Travel.Modules.Rail.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/rail/Travel.Modules.Rail.Tests.Integration/Travel.Modules.Rail.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/rail/Travel.Modules.Rail.Tests.Integration/Travel.Modules.Rail.Tests.Integration.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=rail-adapter-http.trx"

  test-architecture:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore Travel.slnx --no-cache
      - run: dotnet build tests/Travel.Tests.Architecture/Travel.Tests.Architecture.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Tests.Architecture/Travel.Tests.Architecture.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=architecture.trx"

  test-contract:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/Travel.Tests.Contract/Travel.Tests.Contract.csproj --no-cache
      - run: dotnet build tests/Travel.Tests.Contract/Travel.Tests.Contract.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Tests.Contract/Travel.Tests.Contract.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=contract.trx"

  test-flights-integration:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - run: dotnet restore tests/flights/Travel.Modules.Flights.Tests.Integration/Travel.Modules.Flights.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/flights/Travel.Modules.Flights.Tests.Integration/Travel.Modules.Flights.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/flights/Travel.Modules.Flights.Tests.Integration/Travel.Modules.Flights.Tests.Integration.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=flights-integration.trx"

  test-host-integration:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Pre-pull transport images
        timeout-minutes: 5
        run: |
          docker pull pgvector/pgvector:pg17
          docker pull nats:2.12
      - run: dotnet restore tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --no-cache
      - run: dotnet restore tools/demo/Travel.Hotels.Fixture/Travel.Hotels.Fixture.csproj --no-cache
      - run: dotnet build tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet build tools/demo/Travel.Hotels.Fixture/Travel.Hotels.Fixture.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-build --filter "Category=Integration" --verbosity minimal --logger "trx;LogFileName=host-integration.trx"

  test-aspire-smoke:
    needs: [lint, build-dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Pre-pull Aspire images
        timeout-minutes: 10
        run: |
          docker pull pgvector/pgvector:pg17
          docker pull redis:8.6
          docker pull nats:2.12
          docker pull quay.io/keycloak/keycloak:26.6
          docker pull dpage/pgadmin4:9.15.0
          docker pull axllent/mailpit:v1.20
      - run: dotnet restore tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --no-cache
      - run: dotnet build tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Host.Tests.Integration/Travel.Host.Tests.Integration.csproj --configuration Release --no-build --filter "Category=AspireSmoke" --verbosity minimal --logger "trx;LogFileName=aspire-smoke.trx"

  test-ai-evals:
    needs: [lint, build-dotnet]
    if: github.event_name == 'workflow_dispatch' && inputs.run_paid_ai_evals == true
    environment: paid-ai-evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Require protected Anthropic credential
        run: test -n "$ANTHROPIC_API_KEY"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: dotnet restore tests/Travel.Tests.AiEvals/Travel.Tests.AiEvals.csproj --no-cache
      - run: dotnet build tests/Travel.Tests.AiEvals/Travel.Tests.AiEvals.csproj --configuration Release --no-restore
      - run: dotnet test tests/Travel.Tests.AiEvals/Travel.Tests.AiEvals.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=ai-evals.trx"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  test-e2e:
    needs:
      - lint
      - build-dotnet
      - frontend-affected
      - test-trips-full-stack
      - test-flights-unit
      - test-support-unit
      - test-support-integration
      - test-hotels-unit
      - test-hotels-integration
      - test-trips-unit
      - test-trips-integration
      - test-identity-unit
      - test-ai
      - test-host-http
      - test-architecture
      - test-contract
      - test-flights-integration
      - test-host-integration
      - test-aspire-smoke
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.203' }
      - name: Pre-pull Aspire images
        timeout-minutes: 10
        run: |
          docker pull pgvector/pgvector:pg17
          docker pull redis:8.6
          docker pull nats:2.12
          docker pull quay.io/keycloak/keycloak:26.6
          docker pull dpage/pgadmin4:9.15.0
          docker pull axllent/mailpit:v1.20
      - run: npm ci
      - run: dotnet restore Travel.slnx --no-cache
      - run: dotnet build Travel.slnx --configuration Release --no-restore
      - run: npx playwright install --with-deps chromium
      - name: Start Aspire AppHost
        run: |
          dotnet run --project apps/Travel.AppHost/Travel.AppHost.csproj --configuration Release --no-build > apphost.log 2>&1 &
          echo "APPHOST_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for /api/status
        run: |
          for i in {1..60}; do
            if curl --silent --fail --max-time 2 http://localhost:5099/api/status > /dev/null; then
              echo "Host is up (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "Host did not respond in 120s"; tail -200 apphost.log; exit 1
      - name: Smoke README against the real local Host
        run: npm run smoke:readme -- --base-url http://localhost:5099
      - name: Start Angular and wait for :4200
        run: |
          npx nx serve web > web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://localhost:4200/ > /dev/null; then
              echo "Web is up (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "Web did not respond in 80s"; tail -200 web.log; exit 1
      - run: npx nx e2e travel-e2e
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then kill "$WEB_PID" || true; fi
          if [ -n "${APPHOST_PID:-}" ]; then kill "$APPHOST_PID" || true; fi
