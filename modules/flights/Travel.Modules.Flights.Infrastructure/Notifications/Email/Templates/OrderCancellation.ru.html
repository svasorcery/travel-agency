<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Бронирование отменено</title>
</head>
<body>
  <h1>Бронирование отменено</h1>
  <p>Уважаемый(ая) <strong>{{GuestName}}</strong>,</p>
  <p>Ваше бронирование было отменено.</p>
  <table>
    <tr><td><strong>Номер брони:</strong></td><td>{{BookingRef}}</td></tr>
    <tr><td><strong>Маршрут:</strong></td><td>{{ItinerarySummary}}</td></tr>
    <tr><td><strong>Итого:</strong></td><td>{{TotalFormatted}}</td></tr>
    <tr><td><strong>Причина отмены:</strong></td><td>{{CancelReasonText}}</td></tr>
  </table>
  <p>{{RefundText}}</p>
  <p>Если у вас возникли вопросы, пожалуйста, свяжитесь с нами.</p>
</body>
</html>
