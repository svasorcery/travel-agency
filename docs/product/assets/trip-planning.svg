<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="524" viewBox="0 0 1250 524" role="img" aria-labelledby="title desc">
<title id="title">Как собирается план поездки</title><desc id="desc">Четыре шага: подтверждённые параметры, подбор прогулки по данным и правилам, просмотр и принятие человеком, сохранённый редактируемый план.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1250" height="524" rx="0" fill="#f6f3eb" stroke="none"/><text x="48" y="48" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">ПОЕЗДКИ / ОТ ПОЖЕЛАНИЙ К СВОЕМУ ПЛАНУ</text><text x="48" y="108" font-size="43" fill="#142b35" font-weight="600" >Хочу три спокойных дня в Петербурге</text><text x="48" y="150" font-size="23" fill="#4e6367" font-weight="400" >Город, даты, интересы и темп становятся основой для прогулки.</text><text x="48" y="215" font-size="28" fill="#14655c" font-weight="600" >01</text><g class="product-node" data-x="48" data-y="239" data-width="276" data-height="188"><rect x="48" y="239" width="276" height="188" rx="14" fill="#fffefb" stroke="none"/><rect x="48" y="258" width="4" height="150" rx="2" fill="#14655c" stroke="none"/><text x="72" y="278" font-size="27" fill="#142b35" font-weight="600" >Параметры</text><text x="72" y="311" font-size="20" fill="#4e6367" font-weight="400" >Даты и участники</text><text x="72" y="338" font-size="20" fill="#4e6367" font-weight="400" >Архитектура, история</text><text x="72" y="365" font-size="20" fill="#4e6367" font-weight="400" >Спокойный темп</text></g><line x1="327" y1="330" x2="346" y2="330" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><text x="349" y="215" font-size="28" fill="#14655c" font-weight="600" >02</text><g class="product-node" data-x="349" data-y="239" data-width="276" data-height="188"><rect x="349" y="239" width="276" height="188" rx="14" fill="#fffefb" stroke="none"/><rect x="349" y="258" width="4" height="150" rx="2" fill="#14655c" stroke="none"/><text x="373" y="278" font-size="27" fill="#142b35" font-weight="600" >Подбор прогулки</text><text x="373" y="311" font-size="20" fill="#4e6367" font-weight="400" >Места из пакета города</text><text x="373" y="338" font-size="20" fill="#4e6367" font-weight="400" >Пешие переходы</text><text x="373" y="365" font-size="20" fill="#4e6367" font-weight="400" >Причины выбора</text></g><line x1="628" y1="330" x2="647" y2="330" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="215" font-size="28" fill="#14655c" font-weight="600" >03</text><g class="product-node" data-x="650" data-y="239" data-width="276" data-height="188"><rect x="650" y="239" width="276" height="188" rx="14" fill="#e4eee6" stroke="none"/><rect x="650" y="258" width="4" height="150" rx="2" fill="#14655c" stroke="none"/><text x="674" y="278" font-size="27" fill="#142b35" font-weight="600" >Мой выбор</text><text x="674" y="311" font-size="20" fill="#4e6367" font-weight="400" >Рассмотреть маршрут</text><text x="674" y="338" font-size="20" fill="#4e6367" font-weight="400" >Оценить нагрузку</text><text x="674" y="365" font-size="20" fill="#4e6367" font-weight="400" >Принять маршрут</text></g><line x1="929" y1="330" x2="948" y2="330" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><text x="951" y="215" font-size="28" fill="#14655c" font-weight="600" >04</text><g class="product-node" data-x="951" data-y="239" data-width="276" data-height="188"><rect x="951" y="239" width="276" height="188" rx="14" fill="#fffefb" stroke="none"/><rect x="951" y="258" width="4" height="150" rx="2" fill="#14655c" stroke="none"/><text x="975" y="278" font-size="27" fill="#142b35" font-weight="600" >Мои дни</text><text x="975" y="311" font-size="20" fill="#4e6367" font-weight="400" >Сохранить в план</text><text x="975" y="338" font-size="20" fill="#4e6367" font-weight="400" >Перенести занятие</text><text x="975" y="365" font-size="20" fill="#4e6367" font-weight="400" >Добавить свои заметки</text></g><text x="48" y="480" font-size="22" fill="#4e6367" font-weight="400" >Подбор учитывает места и темп. Сохранение и дальнейшие правки – решения путешественника.</text></g></svg>
