<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="661" viewBox="0 0 1250 661" role="img" aria-labelledby="title desc">
<title id="title">Travel и Proofline: действия и доказательства</title><desc id="desc">Два самостоятельных приложения. Travel сохраняет действия по заказу и переписку. Proofline помогает проверить факты по источникам, увидеть условия и недостающие подтверждения, исправить разбор и записать решение оператора.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1250" height="661" rx="0" fill="#f6f3eb" stroke="none"/><text x="48" y="48" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">TRAVEL + PROOFLINE / ДВА САМОСТОЯТЕЛЬНЫХ ПРОЕКТА</text><text x="48" y="108" font-size="43" fill="#142b35" font-weight="600" >Что произошло – и откуда мы это знаем</text><rect x="48" y="155" width="553" height="247" rx="14" fill="#e4eee6" stroke="none"/><rect x="649" y="155" width="553" height="247" rx="14" fill="#e5edf5" stroke="none"/><text x="76" y="203" font-size="35" fill="#14655c" font-weight="600" >Travel</text><text x="677" y="203" font-size="35" fill="#275b8c" font-weight="600" >Proofline</text><text x="76" y="242" font-size="26" fill="#142b35" font-weight="600" >Действия по заказу</text><text x="677" y="242" font-size="26" fill="#142b35" font-weight="600" >Разбор обращения</text><text x="76" y="281" font-size="23" fill="#4e6367" font-weight="400" >Выбранное предложение и условия</text><text x="76" y="315" font-size="23" fill="#4e6367" font-weight="400" >Согласие, оформление, отмена</text><text x="76" y="349" font-size="23" fill="#4e6367" font-weight="400" >Статус, расчёты и переписка</text><text x="677" y="281" font-size="23" fill="#4e6367" font-weight="400" >Источники, факты и хронология</text><text x="677" y="315" font-size="23" fill="#4e6367" font-weight="400" >Цитаты и недостающие подтверждения</text><text x="677" y="349" font-size="23" fill="#4e6367" font-weight="400" >Правка и решение оператора</text><rect x="48" y="437" width="1154" height="130" rx="14" fill="#fffefb" stroke="none"/><text x="76" y="480" font-size="29" fill="#142b35" font-weight="500" >&quot;Согласен, если номер тихий и окна во двор&quot;.</text><text x="76" y="523" font-size="22" fill="#4e6367" font-weight="400" >Два условия, которые нужно сохранить в разборе и проверить перед следующим решением.</text><text x="48" y="617" font-size="22" fill="#4e6367" font-weight="400" >Общая тема: сохранять факты, видеть их основания и понимать, кто принял решение.</text></g></svg>
