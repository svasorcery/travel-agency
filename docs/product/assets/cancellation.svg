<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="676" viewBox="0 0 1250 676" role="img" aria-labelledby="title desc">
<title id="title">Отмена и возврат: отдельные подтверждения</title><desc id="desc">Согласие на условия и результат отмены. После подтверждённой отмены расчёты поставщика и возврат клиенту учитываются отдельно. Допустимый возврат финансируется агентством без ожидания расчётов поставщика. Неопределённый исход требует проверки фактов и при необходимости ручного разбора.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1250" height="676" rx="0" fill="#f6f3eb" stroke="none"/><text x="48" y="48" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">АВИАЗАКАЗ / ЧТО ПРОИСХОДИТ ПРИ ОТМЕНЕ</text><text x="48" y="107" font-size="43" fill="#142b35" font-weight="600" >У каждого шага – своё подтверждение</text><g class="product-node" data-x="48" data-y="154" data-width="353" data-height="171"><rect x="48" y="154" width="353" height="171" rx="14" fill="#fffefb" stroke="none"/><rect x="48" y="173" width="4" height="133" rx="2" fill="#14655c" stroke="none"/><text x="72" y="193" font-size="27" fill="#142b35" font-weight="600" >Условия и согласие</text><text x="72" y="226" font-size="20" fill="#4e6367" font-weight="400" >Весь заказ, сумма, срок</text><text x="72" y="253" font-size="20" fill="#4e6367" font-weight="400" >Путешественник принимает</text><text x="72" y="280" font-size="20" fill="#4e6367" font-weight="400" >конкретное предложение</text></g><g class="product-node" data-x="447" data-y="154" data-width="353" data-height="171"><rect x="447" y="154" width="353" height="171" rx="14" fill="#e4eee6" stroke="none"/><rect x="447" y="173" width="4" height="133" rx="2" fill="#14655c" stroke="none"/><text x="471" y="193" font-size="27" fill="#142b35" font-weight="600" >Отмена заказа</text><text x="471" y="226" font-size="20" fill="#4e6367" font-weight="400" >Результат поставщика</text><text x="471" y="253" font-size="20" fill="#4e6367" font-weight="400" >Сохранённая история</text><text x="471" y="280" font-size="20" fill="#4e6367" font-weight="400" >Обновление страницы</text></g><g class="product-node" data-x="846" data-y="154" data-width="353" data-height="171"><rect x="846" y="154" width="353" height="171" rx="14" fill="#f5e6d9" stroke="none"/><rect x="846" y="173" width="4" height="133" rx="2" fill="#a34a2f" stroke="none"/><text x="870" y="193" font-size="27" fill="#142b35" font-weight="600" >Если результат неясен</text><text x="870" y="226" font-size="20" fill="#4e6367" font-weight="400" >Проверка фактов</text><text x="870" y="253" font-size="20" fill="#4e6367" font-weight="400" >Ручной разбор</text><text x="870" y="280" font-size="20" fill="#4e6367" font-weight="400" >Сохранение подтверждений</text></g><line x1="405" y1="235" x2="439" y2="235" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="377" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">ПОСЛЕ ПОДТВЕРЖДЁННОЙ ОТМЕНЫ / ДВЕ ИСТОРИИ РАСЧЁТОВ</text><g class="product-node" data-x="48" data-y="405" data-width="553" data-height="171"><rect x="48" y="405" width="553" height="171" rx="14" fill="#fffefb" stroke="none"/><rect x="48" y="424" width="4" height="133" rx="2" fill="#14655c" stroke="none"/><text x="72" y="444" font-size="27" fill="#142b35" font-weight="600" >Расчёты с поставщиком</text><text x="72" y="477" font-size="20" fill="#4e6367" font-weight="400" >Сколько положено вернуть</text><text x="72" y="504" font-size="20" fill="#4e6367" font-weight="400" >Куда поступают средства поставщика</text><text x="72" y="531" font-size="20" fill="#4e6367" font-weight="400" >Какие подтверждения получены</text></g><g class="product-node" data-x="649" data-y="405" data-width="553" data-height="171"><rect x="649" y="405" width="553" height="171" rx="14" fill="#e5edf5" stroke="none"/><rect x="649" y="424" width="4" height="133" rx="2" fill="#275b8c" stroke="none"/><text x="673" y="444" font-size="27" fill="#142b35" font-weight="600" >Возврат клиенту</text><text x="673" y="477" font-size="20" fill="#4e6367" font-weight="400" >Основание и точная сумма</text><text x="673" y="504" font-size="20" fill="#4e6367" font-weight="400" >Отправка на исходный способ оплаты</text><text x="673" y="531" font-size="20" fill="#4e6367" font-weight="400" >Результат попытки возврата</text></g><text x="48" y="628" font-size="22" fill="#4e6367" font-weight="400" >При подходящих условиях сервис финансирует возврат клиенту до расчёта с поставщиком.</text></g></svg>
