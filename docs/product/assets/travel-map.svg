<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1760" viewBox="0 0 1560 1760" role="img" aria-labelledby="title desc">
<title id="title">Travel: карта продукта</title><desc id="desc">Путешественник и оператор работают в Angular. Travel.Host содержит перелёты, проживание, поезда, поездки, поддержку и личный доступ. Travel.AI – отдельный процесс; Laya даёт подсказки поддержке. Ниже показаны поставщики, подготовленные данные и инфраструктура с назначением каждого компонента.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c1bb"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1560" height="1760" rx="0" fill="#f6f3eb" stroke="none"/><text x="60" y="55" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">TRAVEL / КАРТА ПРОДУКТА</text><text x="60" y="117" font-size="48" fill="#142b35" font-weight="600" >Что работает вокруг одной поездки</text><text x="60" y="159" font-size="24" fill="#4e6367" font-weight="400" >От выбора дороги и жилья до заказа, личного плана и разговора с поддержкой.</text><g class="product-node" data-x="60" data-y="201" data-width="710" data-height="108"><rect x="60" y="201" width="710" height="108" rx="14" fill="#e4eee6" stroke="none"/><rect x="60" y="220" width="4" height="70" rx="2" fill="#14655c" stroke="none"/><text x="84" y="240" font-size="27" fill="#142b35" font-weight="600" >Путешественник</text><text x="84" y="273" font-size="20" fill="#4e6367" font-weight="400" >Выбирает · оформляет · планирует · задаёт вопросы</text></g><g class="product-node" data-x="790" data-y="201" data-width="710" data-height="108"><rect x="790" y="201" width="710" height="108" rx="14" fill="#e5edf5" stroke="none"/><rect x="790" y="220" width="4" height="70" rx="2" fill="#275b8c" stroke="none"/><text x="814" y="240" font-size="27" fill="#142b35" font-weight="600" >Оператор поддержки</text><text x="814" y="273" font-size="20" fill="#4e6367" font-weight="400" >Читает обращение · уточняет · отвечает · решает</text></g><line x1="415" y1="311" x2="415" y2="338" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><line x1="1145" y1="311" x2="1145" y2="338" stroke="#b5c1bb" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="344" width="1440" height="76" rx="14" fill="#142b35" stroke="none"/><text x="88" y="390" font-size="28" fill="#fffefb" font-weight="600" >Общий веб-интерфейс</text><text x="478" y="390" font-size="24" fill="#e0e9e7" font-weight="400" >Angular · поиск, личные разделы и рабочее место оператора</text><line x1="580" y1="421" x2="