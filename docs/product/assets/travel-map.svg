9" font-size="20" fill="#4e6367" font-weight="400" >Пожелания → поля формы</text><text x="1184" y="626" font-size="20" fill="#4e6367" font-weight="400" >Факты → объяснение тарифа</text></g><g class="product-node" data-x="1160" data-y="700" data-width="340" data-height="110"><rect x="1160" y="700" width="340" height="110" rx="14" fill="#f5e6d9" stroke="none"/><rect x="1160" y="719" width="4" height="72" rx="2" fill="#a34a2f" stroke="none"/><text x="1184" y="739" font-size="27" fill="#142b35" font-weight="600" >Laya → поддержка</text><text x="1184" y="772" font-size="20" fill="#4e6367" font-weight="400" >Подсказка категории</text></g><text x="60" y="850" font-size="23" fill="#4e6367" font-weight="400" >У каждой части свои правила; заказ, предложение поставщика и личный план сохраняют свой смысл.</text><line x1="60" y1="882" x2="1500" y2="882" stroke="#b5c1bb" stroke-width="2" /><text x="60" y="923" font-size="17" fill="#4e6367" font-weight="600" letter-spacing="2">ПОСТАВЩИКИ И ДАННЫЕ / КАКАЯ ЧАСТЬ ИХ ИСПОЛЬЗУЕТ</text><g class="product-node" data-x="60" data-y="948" data-width="272" data-height="143"><rect x="60" y="948" width="272" height="143" rx="14" fill="#e4eee6" stroke="none"/><rect x="60" y="967" width="4" height="105" rx="2" fill="#14655c" stroke="none"/><text x="84" y="987" font-size="27" fill="#142b35" font-weight="600" >Duffel</text><text x="84" y="1020" font-size="20" fill="#4e6367" font-weight="400" >Перелёты</text><text x="84" y="1047" font-size="20" fill="#4e6367" font-weight="400" >Проживание · Stays</text></g><g class="product-node" data-x="352" data-y="948" data-width="272" data-height="143"><rect x="352" y="948" width="272" height="143" rx="14" fill="#e4eee6" stroke="none"/><rect x="352" y="967" width="4" height="105" rx="2" fill="#14655c" stroke="none"/><text x="376" y="987" font-size="27" fill="#142b35" font-weight="600" >Travelpayouts</text><text x="376" y="1020" font-size="20" fill="#4e6367" font-weight="400" >Перелёты</text><text x="376" y="1047